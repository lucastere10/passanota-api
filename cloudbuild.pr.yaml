substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: passanota-images
  _IMAGE_NAME: passanota-api
  _SECRET_DATABASE_URL: PASSANOTA_DATABASE_URL
  _SECRET_SUPABASE_KEY: PASSANOTA_SUPABASE_SECRET_KEY
  _SECRET_LLM_API_KEY: PASSANOTA_OPENAI_API_KEY
  _SECRET_RESEND_API_KEY: RESEND_API_KEY

steps:
  - id: validate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for secret in "${_SECRET_DATABASE_URL}" "${_SECRET_SUPABASE_KEY}" "${_SECRET_LLM_API_KEY}" "${_SECRET_RESEND_API_KEY}"; do
          echo "Checking secret: $$secret"
          gcloud secrets describe "$$secret" --project="$PROJECT_ID" >/dev/null
        done
        echo "Validation OK (PR, commit: $COMMIT_SHA)"

  - id: lint
    name: python:3.13-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir uv
        uv pip install --system ".[dev]"
        ruff check app tests
    waitFor: [validate]

  - id: test
    name: python:3.13-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir uv
        uv pip install --system ".[dev]"
        pytest tests/ -q --ignore=tests/test_supabase_integration.py
    waitFor: [lint]

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:pr-$SHORT_SHA
      - -f
      - Dockerfile
      - .
    waitFor: [test]

options:
  logging: CLOUD_LOGGING_ONLY
